name: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: bun install --frozen-lockfile
      - run: mise run test
      - run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - run: VERSION="${GITHUB_REF_NAME#v}" mise run build-all
      - run: gh release create "$GITHUB_REF_NAME" dist/netink-* dist/netink.1 --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
