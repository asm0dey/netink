name: sonar
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar needs history for blame and new-code detection
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: bun install --frozen-lockfile
      - run: mise run typecheck
      - run: bun test --coverage --coverage-reporter=lcov
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
