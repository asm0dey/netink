name: sonar
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar needs history for blame and new-code detection
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - run: mise run typecheck
      - run: bun test --coverage --coverage-reporter=lcov
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
