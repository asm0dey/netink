[tools]
bun = "1.4.4"

[tasks]
fmt = "bunx biome check --write src test"
fmt-check = "bunx biome check src test"
test = "bunx biome check src test && bun test"
typecheck = "bunx tsc --noEmit"
render-home = "bun src/cli.ts render --file examples/home/network.net -o examples/home/network.svg"
man = "mkdir -p dist && bun src/cli.ts __man > dist/netink.md && bunx marked-man dist/netink.md > dist/netink.1"

[tasks.build]
depends = ["man"]
run = "bun build src/cli.ts --compile --outfile dist/netink"

[tasks.build-all]
depends = ["man"]
run = """for t in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
  bun build src/cli.ts --compile --target=bun-$t --outfile dist/netink-$t || exit 1
done
"""
